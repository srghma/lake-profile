[project]
name = "profile-lake"
version = "0.1.0"
description = "Lean 4 Lake profiler and selective command skipper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
profile-lake = "profile_lake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
